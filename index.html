<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nyx | Biblioteca</title>

  <!-- Enlazando fuentes de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  
  <!-- Enlazando la hoja de estilos CSS -->
  <link rel="stylesheet" href="style.css">

</head>
<body class="cuerpo-de-la-pagina">

  <!-- Texto de bienvenida y presentación -->
  <section class="bienvenida">
    <h1 class="titulo-principal-bienvenida">Bienvenido a Nyx</h1>
    <p class="descripcion-bienvenida">
      Explora esta nueva web de novelas indie y sumergete en historias fascinantes.
    </p>
  </section>

  <!-- Contenido principal | Novelas-->
  <main>

    <!-- Tarjeta de novela | plantilla -->
    <article class="tarjeta-de-novela">
      <img src="img/covers/example.jpg" alt="luna example" class="novela-portada">

      <div class="novela-info">
        <h2>Titulo</h2>
        <p>Autor: <a href="LINK_AQUÍ" target="_blank">Nombre del Autor</a></p>
        <div>
          <span class="genero">Fantasía /</span>
          <span class="genero">Romance</span>
          <!-- Diccionario: ec(En Curso) | p(Pausado) | t(terminado) | c(Cancelado)-->
          <p class="estado-publicacion-ec">En curso</p>
          <p class="capitulos">Capítulos: 10</p>
          
        </div>
      </div>
    </article>

  </main>

</body>
</html>
